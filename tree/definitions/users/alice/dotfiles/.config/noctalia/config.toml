[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    center = [ "workspaces" ]
    end = [ "cpu", "ram", "temp", "battery", "control-center" ]
    padding = 6
    scale = 0.80000000
    start = [ "clock", "tray", "notifications", "network_rx", "network_tx" ]
    thickness = 30
    widget_spacing = 3

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
panel_anchor_bar = "default"
settings_show_advanced = false
telemetry_enabled = true

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
custom_palette = "new"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/alice/saves/images/wallpapers"
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/alice/saves/images/wallpapers/flower.png"

    [wallpaper.last]
    path = "/home/alice/saves/images/wallpapers/flower.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/alice/saves/images/wallpapers/flower.png"

    [[wallpaper.favorite]]
    custom_palette = "new"
    palette_source = "custom"
    path = "/home/alice/saves/images/wallpapers/PERMANENT-WALLPAPER.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    custom_palette = "new"
    palette_source = "custom"
    path = "/home/alice/saves/images/wallpapers/flower.png"
    theme_mode = "dark"

[widget.battery]
display_mode = "graphic"
hide_when_full = true

[widget.clock]
capsule_padding = 12
format = "{:%a, %b %d, %I:%M %p}"
vertical_format = "{:%b %d %a %I %M %p}"

[widget.control-center]
capsule_radius = "auto"
glyph = "settings-2"

[widget.media]
enabled = false

[widget.sysmon]
stat = "disk_used_pct"

[widget.workspaces]
capsule = true
capsule_padding = 48
hide_when_empty = true
style = "focus_hint"
